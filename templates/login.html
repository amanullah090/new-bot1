<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <meta charset="UTF-8">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;}
        .login-container{background:white;border-radius:20px;width:400px;max-width:90%;}
        .login-header{background:linear-gradient(135deg,#0088cc,#00aaff);color:white;padding:30px;text-align:center;border-radius:20px 20px 0 0;}
        .login-header h1{font-size:28px;}
        .login-body{padding:30px;}
        .input-group{margin-bottom:20px;}
        .input-group input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;}
        button{width:100%;padding:12px;background:linear-gradient(135deg,#0088cc,#00aaff);color:white;border:none;border-radius:10px;font-size:16px;cursor:pointer;}
        .error{background:#fee;color:#c00;padding:10px;border-radius:8px;margin-bottom:15px;text-align:center;}
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header"><h1>🤖 Bot Panel</h1><p>Admin Login</p></div>
        <div class="login-body">
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            <form method="post">
                <div class="input-group"><input type="password" name="password" placeholder="🔐 Password" required></div>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
